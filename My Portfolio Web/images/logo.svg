<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="minovaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d633ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#0c1833" stroke="url(#minovaGrad)" stroke-width="3"/>
  <!-- Stylized Modern M -->
  <path d="M27 67 V35 L43 51 L50 44 L57 51 L73 35 V67" stroke="url(#minovaGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glowing Tech Core Accent -->
  <circle cx="50" cy="62" r="5" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="62" r="2.5" fill="#ffffff" />
</svg>
